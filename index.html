<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>minmomos POS | the ultimate momo station</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function () {
        var RELOAD_KEY = 'minmomos_css_recovery_at';

        function clearStaleCaches() {
          try {
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                regs.forEach(function (r) { r.unregister(); });
              });
            }
          } catch (_) {}
          try {
            if ('caches' in window) {
              caches.keys().then(function (keys) {
                keys.forEach(function (k) { caches.delete(k); });
              });
            }
          } catch (_) {}
        }

        function triggerSingleRecoveryReload() {
          try {
            var last = Number(sessionStorage.getItem(RELOAD_KEY) || '0');
            if (Date.now() - last < 15000) return;
            sessionStorage.setItem(RELOAD_KEY, String(Date.now()));
          } catch (_) {}
          clearStaleCaches();
          setTimeout(function () {
            try {
              var url = new URL(window.location.href);
              url.searchParams.set('_r', String(Date.now()));
              window.location.replace(url.toString());
            } catch (_) {
              window.location.reload();
            }
          }, 120);
        }

        clearStaleCaches();

        window.addEventListener(
          'error',
          function (evt) {
            var target = evt && evt.target;
            if (target && target.tagName === 'LINK' && target.rel === 'stylesheet') {
              triggerSingleRecoveryReload();
            }
          },
          true
        );

        window.addEventListener('vite:preloadError', function () {
          triggerSingleRecoveryReload();
        });

        window.addEventListener('load', function () {
          setTimeout(function () {
            try {
              var bg = window.getComputedStyle(document.body).backgroundColor;
              if (!bg || bg === 'rgba(0, 0, 0, 0)' || bg === 'transparent') {
                triggerSingleRecoveryReload();
              }
            } catch (_) {}
          }, 300);
        });
      })();
    </script>
  </head>
  <body class="font-sans overflow-hidden">
    <div id="root"></div>
    <div id="print-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
